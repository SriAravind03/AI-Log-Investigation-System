<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Log Investigation System</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 32px 40px; border-radius: 12px; width: 100%; max-width: 440px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
    h1 { margin-top: 0; font-size: 22px; }
    p { color: #94a3b8; font-size: 14px; }
    input[type=file] { width: 100%; margin: 16px 0; color: #e2e8f0; }
    button, .btn { background: #38bdf8; color: #0f172a; border: 0; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
    .link { margin-top: 16px; display: block; color: #38bdf8; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>AI Log Investigation System</h1>
    <p>Upload a log file (.log, .txt, .csv, .json or .evtx) to parse it, correlate events and score risk.</p>
    <form method="POST" enctype="multipart/form-data">
      <input type="file" name="logfile" required>
      <button type="submit">Analyze Logs</button>
    </form>
    <a class="link" href="/dashboard">View dashboard &rarr;</a>
  </div>
</body>
</html>
